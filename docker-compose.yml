name: tiktok-v2

services:
  # --- yt-dlp + DNA Clipper Lean (tanpa redis, stabil untuk deploy cepat) ---
  # Sumber utama: ytdlp -> langsung clip via /api/clip/from-download
  # Jalan default: docker compose up -d  (tanpa --profile)
  ytdlp:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiktok-v2:latest
    container_name: tiktok-ytdlp
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ytdlp/health || curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Full stack untuk TikTok Clipper (butuh redis) ---
  # Jalankan dengan: docker compose --profile full up -d
  redis:
    image: redis:7-alpine
    container_name: tiktok-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app_net
    profiles:
      - full

  # Full stack Clipper dengan Redis+CELERY untuk antrian paralel (podcast panjang 40+ chunk)
  # Jalankan: docker compose --profile full up -d
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiktok-v2:latest
    container_name: tiktok-api
    restart: unless-stopped
    ports:
      - "${APP_PORT_FULL:-8001}:8000"
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - full

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiktok-v2:latest
    container_name: tiktok-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --without-heartbeat --without-gossip
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping | grep -q pong || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    profiles:
      - full

networks:
  app_net:
    driver: bridge

volumes:
  redis_data:
    driver: local